<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>WorkTime</title>
<style>
:root {
  --bg: #0d1117;
  --card: #161b22;
  --card-hover: #1c2331;
  --border: #30363d;
  --text: #e6edf3;
  --text-dim: #8b949e;
  --text-muted: #6e7681;
  --green: #3fb950;
  --blue: #58a6ff;
  --red: #f85149;
  --yellow: #d29922;
  --purple: #bc8cff;
  --cyan: #39d0d8;
  --orange: #f0883e;
  --pink: #f778ba;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
.app { max-width: 520px; margin: 0 auto; padding: 0 16px 60px; }

/* Header */
.header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(13,17,23,0.92);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px;
  margin: 0 -16px;
  display: flex; align-items: center; justify-content: space-between;
}
.header-left { display: flex; align-items: center; gap: 10px; }
.header h1 { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; }
.header-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); }
.header-actions { display: flex; gap: 8px; align-items: center; }
.date-input {
  background: var(--card); border: 1px solid var(--border); color: var(--text);
  border-radius: 8px; padding: 5px 8px; font-size: 13px; width: 130px;
}
.btn-refresh {
  background: var(--card); border: 1px solid var(--border); color: var(--text-dim);
  border-radius: 8px; width: 34px; height: 34px; font-size: 16px;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
  transition: all 0.2s;
}
.btn-refresh:active { transform: scale(0.9); background: var(--border); }
.btn-refresh.spinning { animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Cards */
.card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 14px; padding: 16px; margin-top: 12px;
}
.card-title {
  font-size: 12px; color: var(--text-muted); font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 12px;
  display: flex; align-items: center; gap: 6px;
}

/* Time stats */
.time-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--border); border-radius: 10px; overflow: hidden; }
.time-stat { background: var(--card); padding: 14px 8px; text-align: center; }
.time-stat .val { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }
.time-stat .lbl { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
.time-stat.total .val { color: var(--yellow); }
.time-stat.indie .val { color: var(--green); }
.time-stat.work .val { color: var(--blue); }

.sync-status { margin-top:12px; padding-top:10px; border-top:1px solid var(--border); font-size:11px; color:var(--text-dim); line-height:1.7; }
.sync-status small { display:block; color:var(--text-muted); font-size:10px; }
/* Tag bar */
.tag-bar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; margin: 12px 0 8px; gap: 1px; }
.tag-bar > div { border-radius: 1px; }
.tag-list { display: flex; flex-wrap: wrap; gap: 6px; }
.tag-item { font-size: 12px; color: var(--text-dim); display: flex; align-items: center; gap: 4px; }
.tag-dot { width: 8px; height: 8px; border-radius: 2px; }

/* AI section */
.ai-hero { text-align: center; padding: 8px 0 12px; }
.ai-hero .tokens { font-size: 32px; font-weight: 800; color: var(--purple); letter-spacing: -1px; }
.ai-hero .sub { font-size: 13px; color: var(--text-dim); margin-top: 4px; }
.ai-breakdown { display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid var(--border); margin-top: 8px; }
.ai-breakdown-item { text-align: center; }
.ai-breakdown-item .v { font-size: 15px; font-weight: 700; }
.ai-breakdown-item .l { font-size: 10px; color: var(--text-muted); }
.ai-breakdown-item.in .v { color: var(--cyan); }
.ai-breakdown-item.out .v { color: var(--orange); }
.ai-breakdown-item.cached .v { color: var(--text-dim); }

/* Source list */
.source-row { padding: 7px 0; }
.source-row + .source-row { border-top: 1px solid var(--border); }
.source-head { display: flex; justify-content: space-between; align-items: center; }
.source-name { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.source-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.source-stats { font-size: 11px; color: var(--text-muted); }
.source-stats .tk { color: var(--purple); font-weight: 600; }
.source-bar { height: 3px; border-radius: 2px; margin-top: 5px; background: var(--border); overflow: hidden; }
.source-bar-fill { height: 100%; border-radius: 2px; transition: width 0.3s; }

/* Tool chips */
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip {
  font-size: 12px; padding: 4px 10px; border-radius: 8px;
  background: rgba(88,166,255,0.1); border: 1px solid rgba(88,166,255,0.2);
  color: var(--text-dim);
}
.chip .n { color: var(--cyan); font-weight: 700; margin-left: 4px; }
.chip.mcp { background: rgba(188,140,255,0.1); border-color: rgba(188,140,255,0.2); }
.chip.mcp .n { color: var(--purple); }
.chip.skill { background: rgba(63,185,80,0.1); border-color: rgba(63,185,80,0.2); }
.chip.skill .n { color: var(--green); }

/* Project / Task rows */
.row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; }
.row + .row { border-top: 1px solid var(--border); }
.row-left { flex: 1; min-width: 0; }
.row-name { font-size: 14px; font-weight: 500; }
.row-meta { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
.row-right { font-size: 14px; font-weight: 700; flex-shrink: 0; margin-left: 12px; }

/* Heatmap */
.heatmap { display: flex; flex-direction: column; gap: 4px; align-items: center; }
.heatmap-row { display: flex; gap: 4px; }
.hm-cell {
  width: 19px; height: 19px; border-radius: 4px; background: #21262d;
  cursor: pointer; transition: transform 0.1s;
}
.hm-cell:active { transform: scale(1.25); }
.hm-cell.l1 { background: #1f3d2e; }
.hm-cell.l2 { background: #2f6b4e; }
.hm-cell.l3 { background: #4fae7d; }
.hm-cell.l4 { background: #7fe0a8; }
.hm-cell.selected { outline: 2px solid var(--blue); outline-offset: 1px; }
.hm-legend { display: flex; align-items: center; gap: 4px; justify-content: flex-end; font-size: 10px; color: var(--text-muted); margin-top: 10px; }
.hm-legend .hm-cell { width: 14px; height: 14px; cursor: default; }

/* Trend */
.trend { display: flex; align-items: flex-end; gap: 6px; margin-top: 10px; }
.trend-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.trend-plot { height: 90px; width: 100%; display: flex; align-items: flex-end; justify-content: center; }
.trend-bar { width: 70%; border-radius: 4px; min-height: 3px; transition: height 0.3s; }
.trend-bar.today { background: linear-gradient(180deg, #79b8ff, var(--blue)); }
.trend-bar.normal { background: linear-gradient(180deg, #5dd28a, var(--green)); }
.trend-bar.zero { background: var(--border); }
.trend-label { font-size: 10px; color: var(--text-muted); }
.trend-val { font-size: 10px; color: var(--text-dim); min-height: 12px; }

/* Empty / loading / error */
.empty { text-align: center; color: var(--text-muted); padding: 16px; font-size: 13px; }
.loading-screen { text-align: center; padding: 60px 20px; color: var(--text-muted); }
.error-screen { text-align: center; padding: 40px 20px; color: var(--red); font-size: 14px; }
.skeleton { background: linear-gradient(90deg, var(--card) 25%, var(--card-hover) 50%, var(--card) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 14px; height: 80px; margin-top: 12px; }
@keyframes shimmer { to { background-position: -200% 0; } }
/* Execution statistics — intentionally scoped to the panel. */
.execution-panel { --exec-blue: var(--accent, #7aa2f7); --exec-purple: var(--purple, #bb9af7); --exec-muted: var(--text-dim, #9aa5ce); --exec-line: var(--border, #2a2e3f); margin-bottom:16px; }
.exec-header, .exec-heading { display:flex; align-items:center; gap:10px; }
.exec-header { justify-content:space-between; gap:16px; margin-bottom:18px; }
.exec-heading { min-width:0; }
.exec-heading svg, .exec-empty svg { width:19px; height:19px; stroke:var(--exec-blue); stroke-width:1.6; flex-shrink:0; }
.exec-heading h3 { font-size:15px; font-weight:650; letter-spacing:-.02em; white-space:nowrap; margin:0; color:var(--text); }
.exec-period { font-size:10px; line-height:20px; padding:0 7px; border:1px solid var(--exec-line); border-radius:5px; color:var(--exec-muted); white-space:nowrap; }
.exec-help { position:relative; flex-shrink:0; color:var(--exec-muted); }
.exec-help summary { list-style:none; font-size:11px; cursor:pointer; display:flex; align-items:center; gap:6px; }
.exec-help summary::-webkit-details-marker { display:none; }
.exec-help summary:hover { color:var(--text); }
.exec-help summary:focus-visible, .exec-filters button:focus-visible { outline:2px solid var(--exec-blue); outline-offset:4px; border-radius:4px; }
.exec-help-content { position:absolute; top:28px; right:0; width:min(340px, calc(100vw - 64px)); padding:16px; z-index:20; font-size:12px; line-height:1.65; border-radius:9px; border:1px solid var(--exec-line); background:var(--bg-card, var(--card, #1f2335)); box-shadow:0 12px 32px rgba(0,0,0,.35); }
.exec-help-content strong { display:block; font-size:12px; color:var(--text); margin-bottom:8px; }
.exec-help-content p + p { margin-top:8px; }
.exec-help-content b { color:var(--text); }
.exec-summaries { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.exec-summary { min-width:0; padding:17px 18px 14px; border:1px solid var(--exec-line); border-radius:10px; background:rgba(122,162,247,.035); }
.exec-summary.devin { background:rgba(187,154,247,.035); }
.exec-summary.is-empty { background:rgba(255,255,255,.015); }
.exec-source { display:flex; gap:8px; align-items:center; min-height:18px; }
.exec-source strong { font-size:12px; font-weight:650; color:var(--text); }
.exec-source > span:last-child { color:var(--exec-muted); font-size:11px; margin-left:auto; }
.exec-source-dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }
.exec-source-dot.codex { background:var(--exec-blue); }
.exec-source-dot.devin { background:var(--exec-purple); }
.exec-value { display:flex; align-items:baseline; gap:9px; margin-top:13px; min-height:36px; color:var(--exec-blue); font-size:30px; font-weight:700; line-height:1.2; letter-spacing:-.04em; font-variant-numeric:tabular-nums; }
.devin .exec-value { color:var(--exec-purple); }
.exec-value small { font-size:13px; font-weight:500; color:var(--exec-muted); margin-left:3px; letter-spacing:0; }
.exec-value.exec-no-value { color:var(--text-muted, #6e7681); font-size:28px; }
.exec-summary-meta { display:flex; flex-wrap:wrap; gap:6px 12px; font-size:11px; color:var(--exec-muted); margin-top:7px; line-height:1.5; }
.exec-warning { color:var(--yellow, #e0af68) !important; }
.exec-list-heading { display:flex; align-items:center; justify-content:space-between; margin:22px 0 10px; }
.exec-list-heading h4 { font-size:12px; font-weight:650; color:var(--text); margin:0; }
.exec-list-heading > span { font-size:11px; color:var(--exec-muted); }
.exec-filters { display:flex; align-items:center; gap:4px; margin-bottom:12px; }
.exec-filters button { border:1px solid transparent; border-radius:6px; color:var(--exec-muted); background:transparent; padding:5px 9px; font-size:11px; font-family:inherit; cursor:pointer; line-height:18px; }
.exec-filters button:hover { background:rgba(122,162,247,.05); color:var(--text); }
.exec-filters button.active { color:var(--exec-blue); background:rgba(122,162,247,.1); border-color:rgba(122,162,247,.12); }
.exec-filters button > span { font-size:10px; margin-left:7px; opacity:.7; font-variant-numeric:tabular-nums; }
.exec-table-head, .exec-task { display:grid; grid-template-columns:minmax(0, 1fr) minmax(100px, 24%) 100px; gap:20px; align-items:center; }
.exec-table-head { padding:0 0 9px; font-size:10px; color:var(--exec-muted); border-bottom:1px solid var(--exec-line); }
.exec-table-head > span:last-child { text-align:right; }
.exec-task { padding:13px 0; }
.exec-task + .exec-task { border-top:1px solid var(--border-light, var(--exec-line)); }
.exec-task-main { min-width:0; }
.exec-task-title { font-size:13px; font-weight:500; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; line-height:1.5; }
.exec-task-meta { display:flex; align-items:center; gap:8px; margin-top:5px; min-width:0; }
.exec-task-meta > span:last-child { font-size:10px; color:var(--exec-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.exec-source-tag { display:inline-block; font-size:9px; font-weight:600; line-height:17px; padding:0 6px; border-radius:4px; color:var(--exec-blue); background:rgba(122,162,247,.09); flex-shrink:0; }
.exec-source-tag.devin { color:var(--exec-purple); background:rgba(187,154,247,.09); }
.exec-project { font-size:11px; color:var(--exec-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
.exec-task-time { text-align:right; font-size:13px; font-weight:600; color:var(--text); white-space:nowrap; font-variant-numeric:tabular-nums; }
.exec-task-time.is-empty { color:var(--exec-muted); }
.exec-footer { border-top:1px solid var(--exec-line); padding-top:11px; margin-top:2px; font-size:10px; color:var(--exec-muted); display:flex; gap:7px; }
.exec-footer > span { opacity:.6; }
.exec-empty { display:flex; flex-direction:column; gap:10px; align-items:center; justify-content:center; min-height:108px; color:var(--exec-muted); font-size:12px; text-align:center; }
.exec-empty svg { stroke:var(--exec-muted); width:23px; height:23px; opacity:.6; }
@media (max-width:700px) {
 .exec-header { gap:8px; align-items:flex-start; }
 .exec-heading { flex-wrap:wrap; gap:7px; }
 .exec-help summary { font-size:0; gap:0; }
 .exec-help summary > span { font-size:16px; }
 .exec-summary { padding:14px 12px 12px; }
 .exec-source { flex-wrap:wrap; gap:6px; }
 .exec-source > span:last-child { width:100%; margin-left:13px; font-size:10px; }
 .exec-value { font-size:25px; gap:5px; margin-top:12px; }
 .exec-value small { font-size:11px; margin-left:2px; }
 .exec-table-head { display:none; }
 .exec-task { grid-template-columns:minmax(0,1fr) auto; gap:5px 12px; }
 .exec-task-main { grid-column:1; grid-row:1; }
 .exec-project { grid-column:1; grid-row:2; font-size:10px; }
 .exec-task-time { grid-column:2; grid-row:1 / 3; font-size:12px; }
 .exec-footer { flex-wrap:wrap; font-size:9px; }
}

/* Merged legacy activity: secondary detail, never a second timing total. */
.exec-activity { margin-top:14px; border-top:1px solid var(--exec-line); }
.exec-activity > summary { display:flex; align-items:center; gap:9px; list-style:none; cursor:pointer; padding:13px 0; color:var(--exec-muted); font-size:11px; }
.exec-activity > summary::-webkit-details-marker { display:none; }
.exec-activity > summary:hover { color:var(--text); }
.exec-activity > summary:focus-visible { outline:2px solid var(--exec-blue); outline-offset:3px; border-radius:4px; }
.exec-activity > summary strong { font-size:12px; font-weight:550; }
.exec-activity-chevron { display:inline-block; font-size:19px; line-height:12px; transition:transform .15s; }
.exec-activity[open] .exec-activity-chevron { transform:rotate(90deg); }
.exec-activity-count { margin-left:auto; font-size:10px; }
.exec-activity-body { padding-bottom:15px; }
.exec-activity-note { font-size:10px; line-height:1.6; color:var(--exec-muted); margin:0 0 12px; }
.exec-project-scroll { overflow-x:auto; }
.exec-project-table { width:100%; border-collapse:collapse; font-size:11px; }
.exec-project-table th { font-size:10px; color:var(--exec-muted); font-weight:500; text-transform:none; letter-spacing:0; border-bottom:1px solid var(--exec-line); padding:8px 10px; white-space:nowrap; }
.exec-project-table td { padding:10px; border-bottom:1px solid var(--border-light, var(--exec-line)); color:var(--text); font-variant-numeric:tabular-nums; }
.exec-project-table td:first-child { max-width:210px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.exec-project-table th:first-child, .exec-project-table td:first-child { padding-left:0; text-align:left; }
.exec-project-table th:not(:first-child), .exec-project-table td:not(:first-child) { text-align:right; white-space:nowrap; }
.exec-project-table th:last-child, .exec-project-table td:last-child { padding-right:0; }
.exec-project-table td:last-child { color:var(--exec-muted); }
.exec-activity-groups { display:grid; gap:10px; margin-top:14px; }
.exec-activity-group { display:flex; align-items:baseline; gap:10px; }
.exec-activity-label { flex:0 0 58px; font-size:10px; color:var(--exec-muted); }
.exec-activity-chips { display:flex; flex-wrap:wrap; gap:5px; }
.exec-activity-chip { display:inline-flex; align-items:center; gap:7px; padding:2px 7px; font-size:10px; color:var(--exec-muted); background:rgba(122,162,247,.04); border:1px solid var(--exec-line); border-radius:5px; overflow-wrap:anywhere; }
.exec-activity-chip b { color:var(--text); font-weight:550; font-variant-numeric:tabular-nums; }
.exec-activity + .exec-footer { margin-top:0; }
@media (max-width:700px) { .exec-activity-group { flex-direction:column; gap:5px; } .exec-activity-label { flex-basis:auto; } .exec-project-table { min-width:340px; } }
</style>
</head>
<body>
<div id="app">
  <div class="app">
    <div class="header">
      <div class="header-left">
        <div class="header-dot"></div>
        <h1>WorkTime</h1>
      </div>
      <div class="header-actions">
        <input type="date" v-model="selectedDate" class="date-input" @change="loadAll" :max="todayStr">
        <button class="btn-refresh" :class="{spinning: loading}" @click="loadAll">↻</button>
      </div>
    </div>

    <div v-if="loading && !data" class="loading-screen">
      <div style="font-size:28px;margin-bottom:8px">⏳</div>
      <div>加载中…</div>
    </div>
    <div v-else-if="error" class="error-screen">
      <div style="font-size:28px;margin-bottom:8px">⚠️</div>
      <div>{{ error }}</div>
    </div>
    <template v-else-if="data">

      <!-- Time Overview -->
      <div class="card">
        <div class="card-title">⏱ 时长概览</div>
        <div class="time-stats">
          <div class="time-stat total">
            <div class="val">{{ fmtDur(data.totalSeconds) }}</div>
            <div class="lbl">Total</div>
          </div>
          <div class="time-stat indie">
            <div class="val">{{ fmtDur(data.indieSeconds) }}</div>
            <div class="lbl">Indie</div>
          </div>
          <div class="time-stat work">
            <div class="val">{{ fmtDur(data.workSeconds) }}</div>
            <div class="lbl">Work</div>
          </div>
        </div>
        <div class="sync-status">云端汇总 · {{ data.syncedDevices }} 台设备<span v-if="data.cloudUpdatedAt"> · 最近上传 {{ syncTime(data.cloudUpdatedAt) }}</span>
          <small>仅含已上传的数据；每 60 秒检查更新，回到页面时自动刷新。</small>
        </div>
        <div class="tag-bar" v-if="data.totalSeconds > 0">
          <div v-for="t in data.tags" :key="t.tag"
               :style="{width: (t.seconds/data.totalSeconds*100)+'%', background: tagColor(t.tag)}"></div>
        </div>
        <div class="tag-list">
          <span v-for="t in data.tags" :key="t.tag" class="tag-item">
            <span class="tag-dot" :style="{background: tagColor(t.tag)}"></span>
            {{ t.tag }} {{ fmtDur(t.seconds) }}
          </span>
        </div>
      </div>

      <!-- AI Token Usage -->
      <div class="card" v-if="data.ai.total > 0">
        <div class="card-title">🤖 AI Token Usage</div>
        <div class="ai-hero">
          <div class="tokens">{{ fmtTokens(data.ai.total) }}</div>
          <div class="sub">{{ data.ai.sessions }} sessions · {{ data.ai.messages }} messages</div>
        </div>
        <div class="ai-breakdown">
          <div class="ai-breakdown-item in">
            <div class="v">{{ fmtTokens(data.ai.input) }}</div>
            <div class="l">Input</div>
          </div>
          <div class="ai-breakdown-item out">
            <div class="v">{{ fmtTokens(data.ai.output) }}</div>
            <div class="l">Output</div>
          </div>
          <div class="ai-breakdown-item cached">
            <div class="v">{{ fmtTokens(data.ai.cached) }}</div>
            <div class="l">Cached</div>
          </div>

<script>
const SUPABASE_URL = 'https://hqlqqthkiulmozgxbnxx.supabase.co';
const SUPABASE_KEY = 'sb_publishable_V3VfpbZEjZUbvQ4DYilXWQ_x02ikkUs';
// The mobile page always aggregates every device (see README: multi-device
// merge = SUM all device_id rows), so queries intentionally omit device_id.

async function sbFetch(table, params) {
  let url = SUPABASE_URL + '/rest/v1/' + table + '?';
  const q = [];
  if (params.select) q.push('select=' + params.select);
  if (params.eq) q.push(params.eq[0] + '=eq.' + encodeURIComponent(params.eq[1]));
  if (params.lte) q.push(params.lte[0] + '=lte.' + encodeURIComponent(params.lte[1]));
  if (params.gte) q.push(params.gte[0] + '=gte.' + encodeURIComponent(params.gte[1]));
  if (params.order) q.push('order=' + params.order);
  if (params.limit) q.push('limit=' + params.limit);
  url += q.join('&');

  const res = await fetch(url, {
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY,
    },
  });
  if (!res.ok) {
    const body = await res.text();
    throw new Error(table + ': HTTP ' + res.status + ' ' + body.substring(0, 100));
  }
  return res.json();
}

function mobileSyncStatus(tags) {
  var devices = new Set();
  var latest = null;
  (tags || []).forEach(function(row) {
    if (row.tag === 'Idle') return;
    if (row.device_id) devices.add(row.device_id);
    var timestamp = Date.parse(row.updated_at);
    if (Number.isFinite(timestamp) && (latest === null || timestamp > latest)) latest = timestamp;
  });
  return {syncedDevices: devices.size, cloudUpdatedAt: latest === null ? null : new Date(latest).toISOString()};
}
function syncTime(value) {
  return value ? new Date(value).toLocaleString() : '暂无上传';
}

function fmtDur(seconds) {
  if (!seconds || seconds < 1) return '0m';
  var h = Math.floor(seconds / 3600);
  var m = Math.floor((seconds % 3600) / 60);
  if (h > 0) return h + 'h' + (m > 0 ? ' ' + m + 'm' : '');
  return m + 'm';
}

function fmtTokens(n) {
  if (!n) return '0';
  if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B';
  if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(0) + 'K';
  return String(n);
}

function localDateStr(d) {

}

// Reduce a token source to the bare model name.
//   codebuddy/deepseek-v4.1-flash                                  -> deepseek-v4-1-flash
//   dfbyok-provider-<uuid>-step-5-preview-<hash>                   -> step-5-preview
// Keeps one model from being listed per provider / BYOK credential.
//
// Must stay in step with normalize_token_source in tracker/ai_token_reader.py:
// both sides reduce the same cloud rows, so a rule only one of them applies
// splits one model into two rows that disagree between mobile and desktop.
function normalizeTokenSource(source) {
  var name = (source || '').trim();
  var slash = name.indexOf('/');
  if (slash > 0 && slash < name.length - 1) {
    name = name.slice(slash + 1);
  } else {
    name = name.replace(/^[^/]*\/([^/]+)$/, '$1');
  }
  // BYOK: dfbyok-provider-<8-4-4-4-any hex>-<model>-<16 hex>
  var m = name.match(
    /^dfbyok-provider-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]+-(.+?)-[0-9a-f]{16}$/
  );
  if (m) name = m[1];
  if (!name) return 'unknown';
  // Versions are spelled both ways across sources - deepseek-v4-1-flash
  // (Devin) and deepseek-v4.1-flash (DSH/Codex/WorkBuddy) - so a dot between
  // digits folds onto the dash form. Only digits around the dot qualify, so a
  // trailing qualifier such as -sg is untouched.
  return name.replace(/(\d)\.(?=\d)/g, '$1-');
}

// Merge one device's devin_activity snapshot into the accumulated result so the
// day view reflects every device instead of only the first row.
function mergeActivity(target, part) {
  if (part.execution) {
    if (!target.execution) target.execution = {sources: {}, tasks: []};
    Object.keys(part.execution.sources || {}).forEach(function(source) {
      var v = part.execution.sources[source];
      var acc = target.execution.sources[source] || (target.execution.sources[source] = {seconds:0,count:0,missing:0});
      ['seconds','count','missing'].forEach(function(k) { acc[k] += v[k] || 0; });
    });
    target.execution.tasks = target.execution.tasks.concat(part.execution.tasks || []).sort(function(a,b) {return b.seconds-a.seconds;});
  }

  var projMap = {};
  target.projects.forEach(function(p) { projMap[p.project] = p; });
  (part.projects || []).forEach(function(p) {
    var cur = projMap[p.project];
    if (cur) {
      cur.sessions += p.sessions || 0;
      cur.messages += p.messages || 0;
      cur.duration += p.duration || 0;
    } else {
      projMap[p.project] = {
        project: p.project, sessions: p.sessions || 0,
        messages: p.messages || 0, duration: p.duration || 0,
      };
    }
  });
  target.projects = Object.keys(projMap).map(function(k) { return projMap[k]; })
    .sort(function(a, b) { return b.duration - a.duration; });

  ['tool_kinds', 'agent_modes', 'backend_types', 'msg_dist'].forEach(function(field) {
    var src = part[field] || {};
    for (var k in src) target[field][k] = (target[field][k] || 0) + src[k];
  });

  (part.titles || []).forEach(function(t) { target.titles.push(t); });
  target.titles.sort(function(a, b) { return b.duration - a.duration; });
  target.titles = target.titles.slice(0, 10);
}

// Execution panel: keep this self-contained for the standalone mobile page.

        .map(([label, key]) => ({label, values: this.activity[key] || {}}))

    },

    sources() {
      return ['codex', 'devin'].map(id => ({ id, name: id === 'codex' ? 'Codex' : 'Devin',
        label: id === 'codex' ? 'Agent execution' : 'Model requests',
        ...(this.stats.sources?.[id] || {seconds: 0, count: 0, missing: 0}) }));
    },
    tasks() { return [...(this.stats.tasks || [])].sort((a,b) => b.seconds - a.seconds); },

  },
  methods: {

    },

var app = Vue.createApp({

  setup: function() {

    var SOURCE_COLORS = ['#58a6ff', '#3fb950', '#bc8cff', '#f0883e', '#39d0d8', '#d29922', '#f85149', '#ff7b72'];
    function sourceColor(name) {
      var hash = 0;
      for (var i = 0; i < name.length; i++) hash = (hash * 31 + name.charCodeAt(i)) | 0;

    }
    function sourcePct(s) {
      var max = 0;

    }

    function heatmapLevel(cell) {

        .catch(function(e) { if (sequence === loadSequence) error.value = e.message; })
        .finally(function() { if (sequence === loadSequence) loading.value = false; });

    async function loadDay() {
      var d = selectedDate.value;
      var results = await Promise.all([
        sbFetch('tag_time_records_cloud', {
          select: 'device_id,tag,seconds,updated_at',

        sbFetch('time_records_cloud', {
          select: 'display_name,process_name,project,tag,seconds',
          gte: ['date', d], lte: ['date', d],
          order: 'seconds.desc',
        }),
        sbFetch('ai_token_daily_cloud', {
          select: 'source,input_tokens,output_tokens,cached_tokens,sessions,messages',
          gte: ['date', d], lte: ['date', d],
        }),
        sbFetch('tool_call_daily_cloud', {
          select: 'category,name,count',
          gte: ['date', d], lte: ['date', d],
          order: 'count.desc',
        }),
        sbFetch('devin_activity_daily_cloud', {
          select: 'data_json',

      var tags = results[0], apps = results[1], tokens = results[2], tools = results[3], activity = results[4];

      var syncStatus = mobileSyncStatus(tags);

      // Apps (same app/tag may appear on several devices -> sum them)
      var appMap = {};
      for (var i = 0; i < apps.length; i++) {
        var a = apps[i];
        var appKey = a.display_name + '\u0000' + a.tag;
        if (!appMap[appKey]) appMap[appKey] = { name: a.display_name, tag: a.tag, seconds: 0 };
        appMap[appKey].seconds += a.seconds;
      }
      var appsList = Object.keys(appMap).map(function(k) {
        var a = appMap[k];
        return {
          name: a.name, tag: a.tag, seconds: a.seconds,

      var aiInput = 0, aiOutput = 0, aiCached = 0, aiSessions = 0, aiMessages = 0;
      var sourceMap = {};

        var r = tokens[i];

        var out = r.output_tokens || 0;
        var cac = r.cached_tokens || 0;
        aiInput += inp;
        aiOutput += out;
        aiCached += cac;

        if (t.category !== 'mcp' && t.category !== 'skill') continue;
        var toolKey = t.category + '\u0000' + t.name;
        if (!toolMap[toolKey]) toolMap[toolKey] = { name: t.name, category: t.category, count: 0 };
        toolMap[toolKey].count += t.count;
      }
      var toolsList = Object.keys(toolMap).map(function(k) {
        var t = toolMap[k];
        var parts = t.name.split('.');
        return {
          name: t.name,
          shortName: parts.length >= 2 ? parts[parts.length - 1] : t.name,
          count: t.count, category: t.category,
        };
      }).sort(function(a, b) { return b.count - a.count; }).slice(0, 20);

      // Activity: merge every device's snapshot for the day
      var actData = null;
      for (var i = 0; i < activity.length; i++) {
        var raw = activity[i].data_json;
        var part = null;
        try {
          part = typeof raw === 'string' ? JSON.parse(raw) : raw;
        } catch(e) {}
        if (!part) continue;
        if (!actData) {
          actData = { projects: [], tool_kinds: {}, agent_modes: {}, backend_types: {}, msg_dist: {}, titles: [] };
        }
        mergeActivity(actData, part);
      }

      data.value = {
        syncedDevices: syncStatus.syncedDevices, cloudUpdatedAt: syncStatus.cloudUpdatedAt,
        totalSeconds: total, indieSeconds: indie, workSeconds: work,
        tags: tagsList, apps: appsList,
        ai: {
          total: aiTotal, input: aiInput, output: aiOutput, cached: aiCached,
          sessions: aiSessions, messages: aiMessages,
          sources: sources, tools: toolsList,
        },
        activity: actData,
      };
    }

    async function loadHeatmap() {
      var end = new Date();
      var start = new Date(end);
      start.setDate(start.getDate() - 29);
      start.setDate(start.getDate() - start.getDay()); // Align to Sunday

      var startStr = localDateStr(start);
      var endStr = localDateStr(end);

      var tags = await sbFetch('tag_time_records_cloud', {
        select: 'date,tag,seconds',
        gte: ['date', startStr], lte: ['date', endStr],
        order: 'date.asc',
      });

      var dayMap = {};
      for (var i = 0; i < tags.length; i++) {
        if (tags[i].tag === 'Idle') continue;
        dayMap[tags[i].date] = (dayMap[tags[i].date] || 0) + tags[i].seconds;
      }

      var cells = [];
      var cursor = new Date(start);
      var idx = 0;
      while (cursor <= end) {
        var ds = localDateStr(cursor);
        cells.push({ key: 'hm' + idx++, date: ds, seconds: dayMap[ds] || 0 });
        cursor.setDate(cursor.getDate() + 1);
      }
      heatmapData.value = cells;
    }

    async function loadTrend() {
      var end = new Date();
      var start = new Date(end);
      start.setDate(start.getDate() - 6);

      var startStr = localDateStr(start);
      var endStr = localDateStr(end);

      var tags = await sbFetch('tag_time_records_cloud', {
        select: 'date,tag,seconds',
        gte: ['date', startStr], lte: ['date', endStr],
        order: 'date.asc',
      });

      var dayMap = {};
      for (var i = 0; i < tags.length; i++) {
        if (tags[i].tag === 'Idle') continue;
        dayMap[tags[i].date] = (dayMap[tags[i].date] || 0) + tags[i].seconds;
      }

      var labels = ['日','一','二','三','四','五','六'];
      var days = [];
      var cursor = new Date(start);
      while (cursor <= end) {
        var ds = localDateStr(cursor);
        days.push({
          date: ds, seconds: dayMap[ds] || 0,
          label: labels[cursor.getDay()],
          isToday: ds === todayStr,
        });
        cursor.setDate(cursor.getDate() + 1);
      }
      trend7.value = days;
    }

    var refreshTimer;
    function refreshVisible() {
      if (!document.hidden && !loading.value) loadAll();
    }
    Vue.onMounted(function() {
      loadAll();
      refreshTimer = setInterval(refreshVisible, 60000);
      document.addEventListener('visibilitychange', refreshVisible);
      window.addEventListener('pageshow', refreshVisible);
    });
    Vue.onUnmounted(function() {
      clearInterval(refreshTimer);
      document.removeEventListener('visibilitychange', refreshVisible);
      window.removeEventListener('pageshow', refreshVisible);
    });

    return {
      loading: loading, error: error, data: data,
      todayStr: todayStr, selectedDate: selectedDate,
      heatmapWeeks: heatmapWeeks, trend7: trend7, trendMax: trendMax,
      tagColor: tagColor, heatmapLevel: heatmapLevel,
      sourceColor: sourceColor, sourcePct: sourcePct,
      selectDate: selectDate, loadAll: loadAll,
      fmtDur: fmtDur, fmtTokens: fmtTokens, syncTime: syncTime,
      normalizeTokenSource: normalizeTokenSource,
    };
  },
});
app.mount('#app');
</script>
</body>
</html>
